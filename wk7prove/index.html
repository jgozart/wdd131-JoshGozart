<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Form</title>
    <link rel="stylesheet" href="creditcard.css">
    <link rel="icon" href="favicon.ico">
</head>

<body>

<form id="creditCardForm" class="form-grid">

    <div class="card-front">

       <p class="total">TOTAL: $199</p>

        <div class="card-brand">
            <span class="card-icon">💳</span>
            <div class="chip"></div>
        </div>


        <label>CARD NUMBER</label>
        <input type="text" id="cardNumber"
        placeholder="1234 5678 9101 1020"
        maxlength="16">

        <label>CARD HOLDER</label>
        <input type="text" placeholder="John Doe">

        <div id="cardExpiration">
            <label id="expirationDate">EXPIRATION</label>

            <input type="text"
            id="month"
            placeholder="MM"
            maxlength="2"
            aria-labelledby="expirationDate">

            <input type="text"
            id="year"
            placeholder="YY"
            maxlength="2"
            aria-labelledby="expirationDate">
        </div>

    </div>

    <div class="card-back">

        <div class="black-strip"></div>

        <label>CVC/CVV</label>
        <input type="text" id="cvc"
        placeholder="xxx"
        maxlength="3">

    </div>

    <button type="submit">Submit</button>

    <p id="message"></p>

</form>

<script src="creditcard.js"></script>

</body>
</html>
