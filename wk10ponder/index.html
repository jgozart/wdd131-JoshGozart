<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sorting Activities</title>

<link rel="stylesheet" href="styles.css">
<script defer src="hikes.js"></script>

</head>

<body>

<h1>Hike Finder</h1>

<label for="search">Enter Search</label>

<input 
  id="search" 
  type="text"
  placeholder="Search hikes..."
  aria-label="Search hikes by name, description, or tags"
>

    <button 
        id="searchBtn"
        aria-label="Search hikes"
>
    Search
    </button>

    <div 
        id="hike-container"
        aria-live="polite"
        aria-label="Hike search results"
>
    </div>

</body>
</html>
