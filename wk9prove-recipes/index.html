<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recipe Book</title>

<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<meta property="og:type" content="website">
<meta property="og:title" content="Recipe Book">
<meta property="og:description" content="Find delicious homemade recipes including apple crisp and more.">
<meta property="og:url" content="https://yourwebsite.com">
<meta property="og:image" content="images/recipe-book.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Recipe Book">
<meta name="twitter:description" content="Find delicious homemade recipes including apple crisp and more.">
<meta name="twitter:image" content="images/recipe-book.png">

<link rel="icon" href="/favicon.ico">

</head>

<body>

<header class="header">

<div class="logo-area">
<img src="images/recipe-book.png" alt="Recipe Book Logo">
<h1>Recipe Book</h1>
</div>

</header>

<main>
  
  <div class="search">
<input id="searchInput" type="text" placeholder="Search recipes">

<button id="searchBtn">
<img src="images/search.svg" alt="Search">
</button>
</div>

<div id="recipeContainer"></div>




<section class="recipe">

<img src="images/apple-crisp.jpg" alt="Apple Crisp">

<div class="recipe-info">

<h2>Apple Crisp</h2>

<span
  class="rating"
  role="img"
  aria-label="Rating: 4 out of 5 stars"
>
  <span aria-hidden="true">⭐</span>
  <span aria-hidden="true">⭐</span>
  <span aria-hidden="true">⭐</span>
  <span aria-hidden="true">⭐</span>
  <span aria-hidden="true">☆</span>
</span>

<p class="description">
Warm apple crisp made with fresh apples, cinnamon, and a buttery oat topping.
Perfect for fall and family gatherings.
</p>

</div>

</section>

</main>

<footer>

<div class="social">

<a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
<a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
<a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>

</div>

<p>
<a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
Recipe icons created by Freepik - Flaticon
</a>
</p>

</footer>

<script src="recipe.js"></script>
</body>
</html>
