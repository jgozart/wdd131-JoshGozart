<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Blog</title>
  <link rel="stylesheet" href="blog.css" />
</head>

<body>
  <header class="site-header">
    <h1>My Book Blog</h1>
    <p>Thoughts on books worth reading</p>
  </header>

  <main class="grid-container">
    <article class="book-card">
      <img 
        src="Magkycover2.jpg"
        alt="Cover of Magic Kingdom for Sale—Sold by Terry Brooks"
      />

      <section class="book-info">
        <h2>Magic Kingdom for Sale—Sold!</h2>
        <p class="author">by Terry Brooks</p>

        <p>
          A fun fantasy novel about a lawyer who buys a magical kingdom out of boredom
          and discovers ruling a kingdom is harder than it looks.
        </p>
      </section>
    </article>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Book Blog</p>
  </footer>
</body>
</html>
